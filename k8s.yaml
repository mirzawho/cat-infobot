# InfoBot long-polls the Bot API. Replica count 1 and the Recreate strategy make
# sure only one pod polls at a time.
#
# Create the secret first (never commit the real token):
#   kubectl create namespace infobot
#   kubectl -n infobot create secret generic infobot-secret \
#     --from-literal=BOT_TOKEN='123456:ABC...'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: infobot-config
  labels:
    app.kubernetes.io/name: infobot
data:
  INFOBOT_LOG_LEVEL: "info"
  DATA_DIR: "/data"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infobot
  labels:
    app.kubernetes.io/name: infobot
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: infobot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infobot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: infobot
          image: ghcr.io/mirzawho/cat-infobot:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: infobot-config
          env:
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: infobot-secret
                  key: BOT_TOKEN
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Only the lock file lives here; it does not need to survive restarts.
        - name: data
          emptyDir: {sizeLimit: 1Mi}
